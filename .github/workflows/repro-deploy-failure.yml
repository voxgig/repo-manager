name: Repro - old Cloudflare deploy failure

# Manual-trigger-only reproduction of the pre-existing Cloudflare git
# integration ("repomatic") deploy failure - diagnosed as a missing
# frontend build step, not a bug in the application code. frontend/dist is
# gitignored (build output, never committed), and nothing built it before
# `wrangler deploy` ran. This job deliberately skips that step (unlike
# deploy.yml, which includes it) and runs `wrangler deploy --dry-run` -
# which fails on the missing assets directory before it ever checks
# Cloudflare credentials, so this needs no CLOUDFLARE_API_TOKEN secret and
# proves the diagnosis without touching any Cloudflare account at all.
#
# Expected: this job ALWAYS fails. That's the point - a green run here
# would mean the diagnosis is wrong, not that something got fixed.
on:
  workflow_dispatch: {}

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend deps
        working-directory: backend
        run: npm install --force

      # Deliberately no frontend build step here - this is the bug.

      - name: Deploy (expected to fail - no frontend/dist)
        working-directory: backend
        run: npx wrangler deploy --dry-run
