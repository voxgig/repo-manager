openapi: 3.1.0
info:
  title: repo-manager API
  version: v1
  description: 'Strict-JSON REST API, generated from the model. Uniform entity paths: <zone>/<name>[/<id>].'
servers:
  - url: /api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API access key (create one under Settings & security)
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
          required:
            - code
      required:
        - error
paths: {}
